<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><meta name="description" content="Vanshu AI — your personal AI assistant."><title>Vanshu AI</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111725;--line:#283248;--text:#eef3ff;--muted:#8c98ad}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 15% 0%,#172448 0,transparent 36%),radial-gradient(ellipse at 90% 100%,#25163b 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1000px;min-height:100dvh;margin:auto;padding:0 20px;display:flex;flex-direction:column}header{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}.brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:750}.logo,.orb{display:grid;place-items:center;background:linear-gradient(135deg,#70b1ff,#a78bfa);color:#09111e;font-weight:900}.logo{width:37px;height:37px;border-radius:12px}.status{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:12px;color:#aab7cb}.dot{width:7px;height:7px;border-radius:50%;background:#64d7a1}main{width:100%;max-width:780px;margin:auto;flex:1;display:flex;flex-direction:column;padding:28px 0 12px}.welcome{text-align:center;margin:auto 0 25px;padding:25px 0 10px}.orb{width:66px;height:66px;border-radius:22px;margin:0 auto 20px;font-size:28px;box-shadow:0 12px 50px #7799ff30}h1{font-size:clamp(32px,6vw,48px);line-height:1.08;letter-spacing:-1.7px;margin:0 0 12px}.gradient{background:linear-gradient(100deg,#a8d2ff,#c3a7ff);color:transparent;background-clip:text}.subtitle{color:var(--muted);max-width:450px;margin:0 auto 24px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:600px;margin:auto}.suggestion{text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;background:#111725d9;color:#dce6f8;transition:.2s}.suggestion:hover{border-color:#658de7;background:#172139}.suggestion small{display:block;color:var(--muted);font-size:12px;margin-top:4px}#messages{display:flex;flex-direction:column;gap:18px;padding:8px 0 25px}.message{display:flex;gap:12px;align-items:flex-start;animation:appear .2s}.message.user{flex-direction:row-reverse}.avatar{flex:0 0 32px;height:32px;border-radius:11px;display:grid;place-items:center;background:#1b2a46;color:#a8cbff;font-size:11px;font-weight:800}.user .avatar{background:#2a2341;color:#d0bfff}.bubble{max-width:min(84%,650px);padding:13px 16px;border:1px solid var(--line);border-radius:4px 16px 16px 16px;background:#111725;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{border-radius:16px 4px 16px 16px;background:#19233a}.bubble.error{border-color:#7c4545;color:#ffc6c6}.typing{color:var(--muted)}.composer-wrap{position:sticky;bottom:0;padding:12px 0 14px;background:linear-gradient(transparent,var(--bg) 20%)}.toolbar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:10px}.clear{border:0;background:transparent;color:#a9b5ca;padding:6px}.composer{display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 16px;background:#111725;border:1px solid #34415a;border-radius:18px}.composer:focus-within{border-color:#6f96e7}textarea{flex:1;min-height:28px;max-height:160px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:5px 0;line-height:1.5;font:inherit}textarea::placeholder{color:#7f8ba1}.send{height:40px;min-width:42px;border:0;border-radius:12px;background:linear-gradient(135deg,#78b4ff,#a88afa);color:#09111e;font-size:20px;font-weight:800}.send:disabled{opacity:.45}.footnote,footer{text-align:center;color:#69768c;font-size:11px}.footnote{margin-top:9px}footer{padding:0 0 18px}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:520px){.app{padding:0 14px}header{height:66px}main{padding-top:20px}.suggestions{grid-template-columns:1fr}.suggestion{padding:12px}.bubble{max-width:89%}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">V</div><span>Vanshu AI</span></div><div class="status"><span class="dot"></span><span id="statusText">Assistant ready</span></div></header><main>
<section class="welcome" id="welcome"><div class="orb">✦</div><h1>Think it. Ask it.<br><span class="gradient">Build with AI.</span></h1><p class="subtitle">Your personal AI assistant for learning, coding, ideas, and everyday questions.</p><div class="suggestions"><button class="suggestion" data-prompt="Explain a difficult topic to me in simple words.">Learn something<small>Break down a tricky concept</small></button><button class="suggestion" data-prompt="Help me plan and build a small web app step by step.">Build a project<small>Turn an idea into a plan</small></button><button class="suggestion" data-prompt="Give me a challenging maths puzzle and let me solve it.">Challenge me<small>Try a logic or maths puzzle</small></button><button class="suggestion" data-prompt="Help me improve this code and explain why: ">Improve my code<small>Debug, explain, and refine</small></button></div></section>
<div id="messages" aria-live="polite"></div><div class="composer-wrap"><div class="toolbar"><span>Ask Vanshu AI anything</span><button class="clear" id="clearBtn" type="button">New chat ↺</button></div><form class="composer" id="chatForm"><textarea id="prompt" rows="1" maxlength="8000" placeholder="Message Vanshu AI..." aria-label="Message Vanshu AI"></textarea><button class="send" id="sendBtn" type="submit" aria-label="Send message">↑</button></form><div class="footnote">AI can make mistakes. Verify important information.</div></div></main><footer>Vanshu AI · Powered by Gemini</footer></div>
<script>
(()=>{const form=document.getElementById('chatForm'),input=document.getElementById('prompt'),messages=document.getElementById('messages'),welcome=document.getElementById('welcome'),sendBtn=document.getElementById('sendBtn'),statusText=document.getElementById('statusText');let history=[],busy=false;function addMessage(role,text,extra=''){const row=document.createElement('div');row.className='message '+role;const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='user'?'YOU':'V';const bubble=document.createElement('div');bubble.className='bubble '+extra;bubble.textContent=text;row.append(avatar,bubble);messages.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'nearest'});return bubble}function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'}input.addEventListener('input',resize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.prompt;input.focus();resize()}));document.getElementById('clearBtn').addEventListener('click',()=>{history=[];messages.replaceChildren();welcome.hidden=false;statusText.textContent='Assistant ready';input.focus()});form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||busy)return;welcome.hidden=true;addMessage('user',text);input.value='';resize();history.push({role:'user',content:text});busy=true;sendBtn.disabled=true;statusText.textContent='Thinking…';const pending=addMessage('assistant','Vanshu AI is thinking…','typing');try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-16)})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Request failed. Check the server setup and try again.');const answer=String(data.reply||'I could not generate a response.');pending.className='bubble';pending.textContent=answer;history.push({role:'assistant',content:answer});statusText.textContent='Assistant ready'}catch(err){pending.className='bubble error';pending.textContent=err.message||'Something went wrong. Please try again.';history.pop();statusText.textContent='Connection issue'}finally{busy=false;sendBtn.disabled=false;input.focus()}})})();
</script></body></html>
